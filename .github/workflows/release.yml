name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag, version, and main ancestry
        run: |
          expected="${GITHUB_REF_NAME#v}"
          ./scripts/check-version.sh "$expected"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require successful CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 2700 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            run="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch=main -f event=push -f head_sha="$GITHUB_SHA" -f per_page=10 \
              --jq '.workflow_runs | if length == 0 then "" else (sort_by(.run_number) | last | [.status, (.conclusion // "pending"), .html_url] | join("|")) end')"
            if [ -n "$run" ]; then
              status=${run%%|*}; rest=${run#*|}; conclusion=${rest%%|*}; url=${rest#*|}
              case "$status:$conclusion" in
                completed:success) echo "CI passed for $GITHUB_SHA: $url"; exit 0 ;;
                completed:*) echo "CI failed for $GITHUB_SHA ($conclusion): $url" >&2; exit 1 ;;
                *) echo "waiting for CI ($status): $url" ;;
              esac
            else
              echo "waiting for CI to start on $GITHUB_SHA"
            fi
            sleep 15
          done
          echo "timed out waiting for successful CI on $GITHUB_SHA" >&2
          exit 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils libportaudio2 libgl1 libegl1 \
            libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-xinerama0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-sync1 libxcb-xkb1 libgomp1
      - name: Build self-contained packages
        run: |
          VERSION="$(./scripts/check-version.sh)"
          uv run --python 3.13 python packaging/linux/build_deb.py --force-runtime \
            --appimage --output "dist/keyboard-killer_${VERSION}_amd64.deb"
          cp "dist/keyboard-killer_${VERSION}_amd64.deb" dist/keyboard-killer_amd64.deb
          cp "dist/Keyboard-Killer-${VERSION}-x86_64.AppImage" dist/keyboard-killer-x86_64.AppImage
          cp site/install.sh dist/install.sh
          (cd dist && sha256sum keyboard-killer_amd64.deb keyboard-killer-x86_64.AppImage install.sh > SHA256SUMS)
          printf '{"version":"%s"}\n' "$GITHUB_REF_NAME" > dist/version.json
          ar t dist/keyboard-killer_amd64.deb
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Mirror release assets to keyboard-killer.ohrats.party
        env:
          COOLIFY_SSH_KEY: ${{ secrets.COOLIFY_SSH_KEY }}
          COOLIFY_HOST: ${{ secrets.COOLIFY_HOST }}
        shell: bash
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$COOLIFY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          scp -i "$RUNNER_TEMP/deploy_key" -o StrictHostKeyChecking=accept-new \
            dist/keyboard-killer_amd64.deb dist/keyboard-killer-x86_64.AppImage \
            dist/SHA256SUMS dist/version.json "root@${COOLIFY_HOST}:/data/keyboard-killer-releases/"
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Keyboard-Killer ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/keyboard-killer_amd64.deb \
            dist/keyboard-killer-x86_64.AppImage \
            dist/install.sh \
            dist/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  install-smoke:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYBOARD_KILLER_RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
      KEYBOARD_KILLER_APPIMAGE: "1"
      KEYBOARD_KILLER_APPIMAGE_DIR: ${{ github.workspace }}/.install/app
      KEYBOARD_KILLER_BIN_DIR: ${{ github.workspace }}/.install/bin
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install published AppImage
        run: |
          sh site/install.sh
          test -x "$KEYBOARD_KILLER_BIN_DIR/keyboard-killer"
          "$KEYBOARD_KILLER_BIN_DIR/keyboard-killer" --help >/dev/null
      - name: Re-run installer idempotently
        run: |
          sh site/install.sh
          "$KEYBOARD_KILLER_BIN_DIR/keyboard-killer" --help >/dev/null
