<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Keyless">
  <defs>
    <clipPath id="klbc"><rect width="1280" height="440" rx="16"/></clipPath>
    <pattern id="klGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9B8E7F" stroke-width="0.65" opacity="0.28"/>
    </pattern>
  </defs>
  <g clip-path="url(#klbc)">
    <rect width="1280" height="440" fill="#EFECE4"/>
    <rect width="1280" height="440" fill="url(#klGrid)"/>
    <!-- Stereo camera triangulation rays -->
    <line x1="0" y1="52" x2="980" y2="220" stroke="#624A3A" stroke-width="1.2" stroke-dasharray="5 6" opacity="0.45"/>
    <line x1="1280" y1="52" x2="980" y2="220" stroke="#624A3A" stroke-width="1.2" stroke-dasharray="5 6" opacity="0.45"/>
    <line x1="0" y1="220" x2="1280" y2="220" stroke="#624A3A" stroke-width="0.9" opacity="0.24"/>
    <!-- Left: Local voice waveform bars -->
    <g>
      <rect x="148" y="209" width="7" height="22" rx="3.5" fill="#1D1D1B" opacity="0.78"/>
      <rect x="166" y="197" width="7" height="46" rx="3.5" fill="#1D1D1B" opacity="0.78"/>
      <rect x="184" y="179" width="7" height="82" rx="3.5" fill="#C95B2B" opacity="0.92"/>
      <rect x="202" y="193" width="7" height="54" rx="3.5" fill="#1D1D1B" opacity="0.78"/>
      <rect x="220" y="172" width="7" height="96" rx="3.5" fill="#C95B2B" opacity="0.92"/>
      <rect x="238" y="188" width="7" height="64" rx="3.5" fill="#1D1D1B" opacity="0.78"/>
      <rect x="256" y="201" width="7" height="38" rx="3.5" fill="#1D1D1B" opacity="0.78"/>
      <rect x="274" y="184" width="7" height="72" rx="3.5" fill="#C95B2B" opacity="0.92"/>
      <rect x="292" y="199" width="7" height="42" rx="3.5" fill="#1D1D1B" opacity="0.78"/>
      <rect x="310" y="208" width="7" height="24" rx="3.5" fill="#1D1D1B" opacity="0.78"/>
    </g>
    <!-- Center: Bold crisp wordmark -->
    <text x="615" y="244" text-anchor="middle" font-family="'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="-3" fill="#1D1D1B">keyless</text>
    <!-- Right: Optical gaze reticle -->
    <circle cx="980" cy="220" r="102" fill="none" stroke="#624A3A" stroke-width="1.4" stroke-dasharray="6 6" opacity="0.55"/>
    <circle cx="980" cy="220" r="78" fill="#F4F3DF" fill-opacity="0.76" stroke="#1D1D1B" stroke-width="4"/>
    <line x1="980" y1="120" x2="980" y2="160" stroke="#1D1D1B" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="980" y1="280" x2="980" y2="320" stroke="#1D1D1B" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="880" y1="220" x2="920" y2="220" stroke="#1D1D1B" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="1040" y1="220" x2="1080" y2="220" stroke="#1D1D1B" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="980" cy="220" r="22" fill="#C95B2B"/>
    <circle cx="980" cy="220" r="8" fill="#F4F3DF"/>
  </g>
</svg>
