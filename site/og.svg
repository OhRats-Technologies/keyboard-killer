<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Keyless">
  <defs>
    <clipPath id="klbc"><rect width="1280" height="720" rx="0"/></clipPath>
    <pattern id="klGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9B8E7F" stroke-width="0.65" opacity="0.28"/>
    </pattern>
  </defs>
  <g clip-path="url(#klbc)">
    <rect width="1280" height="720" fill="#EFECE4"/>
    <rect width="1280" height="720" fill="url(#klGrid)"/>
    <!-- Stereo camera triangulation rays -->
    <line x1="0" y1="86" x2="980" y2="360" stroke="#624A3A" stroke-width="1.2" stroke-dasharray="5 6" opacity="0.45"/>
    <line x1="1280" y1="86" x2="980" y2="360" stroke="#624A3A" stroke-width="1.2" stroke-dasharray="5 6" opacity="0.45"/>
    <line x1="0" y1="360" x2="1280" y2="360" stroke="#624A3A" stroke-width="0.9" opacity="0.24"/>
    <!-- Left: Local voice waveform bars -->
    <g>
      <rect x="148" y="347" width="7" height="27" rx="3.5" fill="#1D1D1B" opacity="0.78"/>
      <rect x="168" y="332" width="7" height="57" rx="3.5" fill="#1D1D1B" opacity="0.78"/>
      <rect x="188" y="309" width="7" height="102" rx="3.5" fill="#C95B2B" opacity="0.92"/>
      <rect x="208" y="327" width="7" height="67" rx="3.5" fill="#1D1D1B" opacity="0.78"/>
      <rect x="228" y="300" width="7" height="120" rx="3.5" fill="#C95B2B" opacity="0.92"/>
      <rect x="248" y="320" width="7" height="80" rx="3.5" fill="#1D1D1B" opacity="0.78"/>
      <rect x="268" y="337" width="7" height="47" rx="3.5" fill="#1D1D1B" opacity="0.78"/>
      <rect x="288" y="315" width="7" height="90" rx="3.5" fill="#C95B2B" opacity="0.92"/>
      <rect x="308" y="334" width="7" height="52" rx="3.5" fill="#1D1D1B" opacity="0.78"/>
      <rect x="328" y="345" width="7" height="30" rx="3.5" fill="#1D1D1B" opacity="0.78"/>
    </g>
    <!-- Center: Bold crisp wordmark -->
    <text x="615" y="388" text-anchor="middle" font-family="'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-3.5" fill="#1D1D1B">keyless</text>
    <!-- Right: Optical gaze reticle -->
    <circle cx="980" cy="360" r="126" fill="none" stroke="#624A3A" stroke-width="1.4" stroke-dasharray="6 6" opacity="0.55"/>
    <circle cx="980" cy="360" r="96" fill="#F4F3DF" fill-opacity="0.76" stroke="#1D1D1B" stroke-width="4"/>
    <line x1="980" y1="242" x2="980" y2="282" stroke="#1D1D1B" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="980" y1="438" x2="980" y2="478" stroke="#1D1D1B" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="862" y1="360" x2="902" y2="360" stroke="#1D1D1B" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="1058" y1="360" x2="1098" y2="360" stroke="#1D1D1B" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="980" cy="360" r="24" fill="#C95B2B"/>
    <circle cx="980" cy="360" r="8" fill="#F4F3DF"/>
  </g>
</svg>
